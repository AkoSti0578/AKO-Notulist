name: Release

# Push a tag like v1.2.0 (see scripts/bump-version.sh) to build the signed APK and
# publish it as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Check tag matches versionName
        run: |
          VERSION=$(grep '^versionName=' version.properties | cut -d= -f2)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME komt niet overeen met versionName $VERSION in version.properties"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret KEYSTORE_BASE64 ontbreekt"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test and build signed release APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK"
          cp "$APK" "AKO-Notulist-$VERSION.apk"
          sha256sum "AKO-Notulist-$VERSION.apk" > "AKO-Notulist-$VERSION.apk.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "AKO-Notulist-$VERSION.apk" "AKO-Notulist-$VERSION.apk.sha256" \
            --title "AKO Notulist $VERSION" \
            --notes "Ondertekende APK voor sideloaden. Installatie: zie de README (met PC: install.ps1 / install.sh; zonder PC: UnknownAuto of een Shizuku-installer)."

      - name: Clean up signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
