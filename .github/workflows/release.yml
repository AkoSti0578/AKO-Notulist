name: Release

# Push a tag like v1.2.0 (see scripts/bump-version.sh) to build the signed APK and
# publish it as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Check tag matches versionName
        run: |
          VERSION=$(grep '^versionName=' version.properties | cut -d= -f2)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME komt niet overeen met versionName $VERSION in version.properties"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for n in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -z "${!n}" ] && missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Ontbrekende repository secrets:$missing. Voeg ze toe onder Settings > Secrets and variables > Actions > tabblad 'Secrets' > 'New repository secret' (dus NIET bij Variables of Environments)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test and build signed release APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK"
          cp "$APK" "AKO-Notulist-$VERSION.apk"
          sha256sum "AKO-Notulist-$VERSION.apk" > "AKO-Notulist-$VERSION.apk.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="AKO-Notulist-$VERSION.apk AKO-Notulist-$VERSION.apk.sha256"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Release was already created (e.g. by hand on github.com): just attach the APK.
            gh release upload "$GITHUB_REF_NAME" $FILES --clobber
          else
            gh release create "$GITHUB_REF_NAME" $FILES \
              --title "AKO Notulist $VERSION" \
              --notes "Ondertekende APK voor sideloaden. Installatie: zie de README (met pc: install.ps1 / install.sh; zonder pc: UnknownAuto of een Shizuku-installer)."
          fi

      - name: Clean up signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
